<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <rect width="128" height="128" rx="28" fill="#080a0d" />
  <g transform="translate(0, 0)">
    <!-- Red/Orange Chromatic Split -->
    <g stroke="#ff3b5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" transform="translate(-1.8, -1.2)">
      <polygon points="64,20 102.1,42 102.1,86 64,108 25.9,86 25.9,42" fill="none" />
      <line x1="64" y1="20" x2="64" y2="108" />
      <line x1="25.9" y1="42" x2="102.1" y2="86" />
      <line x1="25.9" y1="86" x2="102.1" y2="42" />
    </g>

    <!-- Cyan/Blue Chromatic Split -->
    <g stroke="#00f0ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" transform="translate(1.8, 1.2)">
      <polygon points="64,20 102.1,42 102.1,86 64,108 25.9,86 25.9,42" fill="none" />
      <line x1="64" y1="20" x2="64" y2="108" />
      <line x1="25.9" y1="42" x2="102.1" y2="86" />
      <line x1="25.9" y1="86" x2="102.1" y2="42" />
    </g>

    <!-- White Core Wireframe -->
    <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.98">
      <polygon points="64,20 102.1,42 102.1,86 64,108 25.9,86 25.9,42" fill="none" />
      <line x1="64" y1="20" x2="64" y2="108" />
      <line x1="25.9" y1="42" x2="102.1" y2="86" />
      <line x1="25.9" y1="86" x2="102.1" y2="42" />
    </g>

    <!-- Corner Nodes -->
    <g fill="#ffffff">
      <circle cx="64" cy="20" r="2.2" />
      <circle cx="102.1" cy="42" r="2.2" />
      <circle cx="102.1" cy="86" r="2.2" />
      <circle cx="64" cy="108" r="2.2" />
      <circle cx="25.9" cy="86" r="2.2" />
      <circle cx="25.9" cy="42" r="2.2" />
      <circle cx="64" cy="64" r="2.5" />
    </g>
  </g>
</svg>
